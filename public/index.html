<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Team chat</title>
</head>
<body>
    <div class="app">
        <form class="join" id="join-form">
            <span class="join-avatar"><i class="fa fa-user"></i></span>
            <h1 class="join-title">Join the chat</h1>
            <label class="join-label" for="name-input">Your name</label>
            <input type="text" id="name-input" class="join-input" maxlength="30" autocomplete="off" placeholder="e.g. Essie">
            <p class="error" id="join-error" role="alert"></p>
            <button type="submit" class="join-button">Start chatting</button>
        </form>

        <section class="chat hidden" id="chat">
            <header class="chat-header">
                <h1 class="chat-title">Team chat</h1>
                <p class="chat-status" id="chat-status">Connecting…</p>
            </header>

            <ul class="message-container" id="message-container"></ul>

            <form class="message-form" id="message-form">
                <input type="text" class="message-input" id="message-input" name="message"
                       maxlength="500" autocomplete="off" placeholder="Type a message...">
                <button type="submit" class="send-button" aria-label="Send message">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </form>
            <p class="error" id="message-error" role="alert"></p>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>
</html>
